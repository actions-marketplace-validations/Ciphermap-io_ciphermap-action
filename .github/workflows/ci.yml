name: Validate Action Metadata & Shell Safety

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate action.yml & Composite Shell Steps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Marketplace Metadata & Composite Steps
        run: |
          ruby -ryaml -e '
            doc = YAML.load_file("action.yml")
            abort("Missing name") unless doc["name"].is_a?(String) && !doc["name"].empty?
            abort("Missing author") unless doc["author"] == "CipherMap"
            desc = doc["description"].to_s
            abort("Description must be 1..125 chars without trailing period (got #{desc.length})") if desc.empty? || desc.length > 125 || desc.end_with?(".")
            abort("Invalid branding") unless doc.dig("branding", "icon") == "shield" && doc.dig("branding", "color") == "purple"
            abort("Must be composite") unless doc.dig("runs", "using") == "composite"
            steps = doc.dig("runs", "steps") || []
            abort("Expected >= 5 composite steps") if steps.length < 5
            sha_default = doc.dig("inputs", "installer-sha256", "default").to_s
            abort("Invalid 64-hex installer-sha256 default") unless sha_default.match?(/\A[0-9a-f]{64}\z/)
            puts "Validated #{doc["name"]} (#{desc.length}/125 chars, #{steps.length} steps)"
          '

      - name: Run Bash Syntax & ShellCheck Error Gate on All Composite Steps
        run: |
          tmpdir="$(mktemp -d)"
          ruby -ryaml -e '
            doc = YAML.load_file("action.yml")
            expr_open = "$" + "{{"
            (doc.dig("runs", "steps") || []).each_with_index do |step, idx|
              next unless step["run"]
              abort("Forbidden GitHub expression inside composite run: step #{idx}") if step["run"].include?(expr_open)
              File.write(File.join(ARGV[0], "step_#{idx}.sh"), "#!/usr/bin/env bash\n" + step["run"])
            end
          ' "$tmpdir"
          for f in "$tmpdir"/step_*.sh; do
            bash -n "$f"
          done
          shellcheck -S error "$tmpdir"/step_*.sh
          rm -rf "$tmpdir"

      - name: Execute Composite Steps End-to-End Against Stderr-Version Binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/ciphermap" <<'MOCK'
          #!/usr/bin/env bash
          if [ "${1:-}" = "version" ]; then
            echo "CipherMap Version v1.0.6" >&2
            exit 0
          fi
          if [ "${1:-}" = "scan" ]; then
            echo '{"version":"2.1.0","runs":[]}' > ciphermap.sarif
            exit 0
          fi
          if [ "${1:-}" = "cbom" ]; then
            echo '{"bomFormat":"CycloneDX","specVersion":"1.7"}' > cbom.cdx.json
            exit 0
          fi
          exit 0
          MOCK
          chmod +x "$HOME/.local/bin/ciphermap"

          work="$(mktemp -d)"
          ruby -ryaml -e '
            doc = YAML.load_file("action.yml")
            steps = doc.dig("runs", "steps")
            File.write(ARGV[0] + "/s0.sh", steps[0]["run"])
            File.write(ARGV[0] + "/s1.sh", steps[1]["run"])
            File.write(ARGV[0] + "/s4.sh", steps[4]["run"])
          ' "$work"
          export GITHUB_PATH="$work/gh_path" GITHUB_ENV="$work/gh_env" GITHUB_OUTPUT="$work/gh_out"
          touch "$GITHUB_PATH" "$GITHUB_ENV" "$GITHUB_OUTPUT"
          export CM_CLI_VERSION="v1.0.6"
          export CM_INSTALLER_SHA256="f28b1bb75700bdff32867ddb3b61857bed421aa8cc088c4e665f4fbc3017c797"
          export CM_LICENSE_KEY=""
          (cd "$work" && bash s0.sh)
          set -a
          source "$GITHUB_ENV"
          set +a
          export CM_FAIL_ON="high" CM_TARGET="cnsa-2.0" CM_SARIF_FILE="ciphermap.sarif" CM_INCLUDE_ARCHIVES="false" CM_EXTRA_ARGS=""
          (cd "$work" && bash s1.sh && test -s ciphermap.sarif)
          export CM_CBOM_FILE="cbom.cdx.json" CM_CBOM_SPEC_VERSION="1.7" CM_CBOM_HTML_FILE="" CM_ATTEST_SLSA="false" CM_PQC_DEVICE_KEY="" CM_COMPLIANCE_FRAMEWORK="" CM_COMPLIANCE_OUTPUT="" CM_WRAPPER_TARGET="" CM_WRAPPER_OUT_DIR="" CM_BASELINE_FILE="" CM_VENDOR_SLA="false"
          (cd "$work" && bash s4.sh && test -s cbom.cdx.json)
          rm -rf "$work" "$HOME/.local/bin/ciphermap"
